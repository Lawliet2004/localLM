name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
      - name: Install Linux native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libpipewire-0.3-dev libxcb1-dev libxdo-dev libgbm-dev libegl1-mesa-dev libxkbcommon-dev
      # The backend is written in a deliberately dense house style and is not
      # rustfmt-formatted, so `cargo fmt --check` is not a gate here. Clippy
      # is: it catches the lints that matter (dead code, needless borrows,
      # a guard held across an await, unwraps in production paths).
      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --lib --all-targets -- -D warnings
      - name: Check
        working-directory: src-tauri
        run: cargo check --lib --all-targets
      - name: Test
        working-directory: src-tauri
        run: cargo test --lib
      - name: Agent loop acceptance (isolated loopback provider)
        working-directory: src-tauri
        # These tests use temporary app data and a scripted local SSE server;
        # they require TCP, but no browser, model weights or provider secrets.
        run: cargo test --lib chat::output_recovery_tests -- --ignored

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Build web worker and GenUI prompt
        run: npm run build:web
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npx vitest run
