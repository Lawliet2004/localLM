name: Development tools
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src-tauri/src/**'
      - 'src/components/DevelopmentSettings*'
      - 'src/components/LanguageServerSettings*'
      - 'scripts/development-acceptance.py'
      - '.github/workflows/development-tools.yml'
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rust-analyzer
      - name: Linux native build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libpipewire-0.3-dev libxcb1-dev libxdo-dev libgbm-dev libegl1-mesa-dev libxkbcommon-dev
      - run: npm ci
      - name: Install isolated CI protocol dependencies
        run: |
          python -m pip install debugpy==1.8.17
          npm install --global typescript@5.9.3 typescript-language-server@5.0.0
      - name: Resolve installed executables
        shell: python
        run: |
          import os, shutil, subprocess, sys
          with open(os.environ['GITHUB_ENV'], 'a') as out:
            out.write('LOCALLM_DEBUGPY_PYTHON=' + sys.executable + '\n')
            out.write('LOCALLM_RUST_ANALYZER=' + shutil.which('rust-analyzer') + '\n')
            out.write('LOCALLM_TYPESCRIPT_LANGUAGE_SERVER=' + shutil.which('node') + '\n')
            npm = 'npm.cmd' if os.name == 'nt' else 'npm'
            root = subprocess.check_output([npm, 'root', '--global'], text=True).strip()
            out.write('LOCALLM_TYPESCRIPT_LANGUAGE_SERVER_SCRIPT=' + os.path.join(root, 'typescript-language-server', 'lib', 'cli.mjs') + '\n')
      # Required missing dependencies intentionally fail strict acceptance.
      # The always-upload step preserves blockers and logs for all platforms.
      - name: Deterministic and required native acceptance
        run: python scripts/development-acceptance.py --unit --strict --output acceptance-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: development-tools-${{ matrix.os }}
          path: acceptance-results
