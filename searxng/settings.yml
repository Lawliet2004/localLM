use_default_settings: true

general:
  debug: false
  instance_name: "LocalLM Search Engine"

search:
  safe_search: 0
  autocomplete: ""
  default_lang: "auto"
  formats:
    - html
    - json

server:
  port: 8080
  bind_address: "0.0.0.0"
  secret_key: "locallm-local-search-secret-key-change-in-production"
  limiter: false
  image_proxy: false

ui:
  static_use_hash: true

outgoing:
  request_timeout: 8.0
  max_request_timeout: 12.0
  useragent_suffix: "LocalLM/1.0"

# With use_default_settings the full upstream engine catalogue loads (~260
# engines, many enabled by default). The client sends an `engines` whitelist
# per query, so this section only pins overrides. General web results ride on
# `google cse` (key-free, enabled by default) plus `duckduckgo` (intermittent
# CAPTCHA), `google news`, `reuters`, `wikipedia`/`wikinews`, and the niche
# engines. `mojeek`/`startpage` are `inactive` upstream (proof-of-work
# CAPTCHA) and cannot be enabled here.
engines:
  - name: yep
    disabled: false
  - name: google
    disabled: true
  - name: bing
    disabled: true
  - name: yandex
    disabled: true
  - name: brave
    disabled: true
  - name: qwant
    disabled: true

enabled_plugins:
  - 'Hash plugin'
