use_default_settings:
  engines:
    keep_only:
      - google cse
      - yep
      - wikipedia
      - google news
      - reuters
      - wikinews
      - stackoverflow
      - github
      - arxiv
      - openstreetmap

general:
  debug: false
  instance_name: "LocalLM Search Engine"

search:
  safe_search: 0
  autocomplete: ""
  default_lang: "auto"
  formats:
    - html
    - json

server:
  port: 8080
  bind_address: "0.0.0.0"
  secret_key: "locallm-local-search-secret-key-change-in-production"
  limiter: false
  image_proxy: false

ui:
  static_use_hash: true

outgoing:
  request_timeout: 8.0
  max_request_timeout: 12.0
  useragent_suffix: "LocalLM/1.0"

# Keep engine selection on the server. Clients can use categories or explicitly
# override engines without depending on this catalogue on every installation.
engines:
  - name: yep
    disabled: false

plugins:
  searx.plugins.hash_plugin.SXNGPlugin:
    active: true
