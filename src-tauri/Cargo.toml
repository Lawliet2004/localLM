[package]
name = "locallm"
version = "0.1.0"
description = "A local AI workspace"
authors = ["LocalLM contributors"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
harness-eval = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40.2", features = ["bundled", "hooks", "limits", "backup"] }
reqwest = { version = "0.13.4", default-features = false, features = ["json", "stream", "native-tls", "cookies", "multipart", "form"] }
tokio = { version = "1.53.1", features = ["process", "io-util", "time", "sync", "macros", "net", "fs"] }
uuid = { version = "1.26.0", features = ["v4"] }
futures-util = "0.3.34"
notify = "8.2"
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "handshake"] }
csv = "1.3"
roxmltree = "0.21"
serde_yaml_ng = "0.10"
toml = "0.9"
bytes = "1"
sse-stream = "0.2.6"
tauri-plugin-dialog = "2.7.3"
rmcp = { version = "3.2.0", default-features = false, features = ["client", "transport-async-rw", "transport-streamable-http-client-reqwest", "reqwest-native-tls", "auth"] }
keyring = { version = "3", default-features = false }
aes-gcm = "0.10"
async-trait = "0.1.92"
sha2 = "0.10"
base64 = "=0.23.1"
cap-std = "4"
portable-pty = "0.9"
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
tempfile = "3.27.0"
flate2 = "1"
tar = "0.4"
process-wrap = { version = "10.0.0", default-features = false, features = ["tokio1", "job-object", "creation-flags", "kill-on-drop", "process-group"] }
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std", "serde"] }
enigo = { version = "=0.6.1", default-features = true }
xcap = "=0.9.8"
image = { version = "=0.25.10", default-features = false, features = ["png"] }
cap-fs-ext = "4"
jsonschema = { version = "=0.58.6", default-features = false }
# Already present transitively at these versions. Reuse bounded regex matching
# and the standard glob parser for model-facing workspace search.
regex = "=1.13.1"
glob = "=0.3.4"
lopdf = { version = "=0.44.0", default-features = false }

[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_SystemInformation", "Win32_Storage_FileSystem"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", features = ["fs", "process"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }
gtk = "=0.18.2"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[profile.dev]
debug = 0
incremental = false


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
tokio = { version = "1.53.1", features = ["test-util"] }
tempfile = "3.27.0"
flate2 = "1"
tar = "0.4"

[target.'cfg(target_os = "linux")'.dev-dependencies]
webkit2gtk = "=2.0.2"
