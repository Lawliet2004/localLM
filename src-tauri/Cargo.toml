[package]
name = "locallm"
version = "0.1.0"
description = "A local AI workspace"
authors = ["LocalLM contributors"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
reqwest = { version = "0.13.4", default-features = false, features = ["json", "stream", "native-tls"] }
tokio = { version = "1.53.1", features = ["process", "io-util", "time", "sync", "macros", "net"] }
uuid = { version = "1.26.0", features = ["v4"] }
futures-util = "0.3.34"
tauri-plugin-dialog = "2.7.3"
rmcp = { version = "3.2.0", default-features = false, features = ["client", "transport-streamable-http-client-reqwest", "reqwest-native-tls", "auth"] }
keyring = { version = "3", features = ["windows-native"] }
aes-gcm = "0.10"
async-trait = "0.1.92"
sha2 = "0.10"
cap-std = "4"
tempfile = "3.27.0"
process-wrap = { version = "10.0.0", default-features = false, features = ["tokio1", "job-object", "creation-flags", "kill-on-drop", "process-group"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_System_Threading", "Win32_System_SystemInformation"] }

[profile.dev]
debug = 0
incremental = false


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
tempfile = "3.27.0"
